name: feature-002-requirements-revise

on:
  push:
    branches:
      - feature/FEATURE-002-timed-training

permissions:
  contents: write

jobs:
  revise:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/FEATURE-002-timed-training
      - uses: actions/checkout@v4
        with:
          repository: v-v-d/ai-workflow
          ref: main
          path: .feature-pipeline
      - name: Record human change and resubmit requirements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess

          pipeline = Path('.feature-pipeline/scripts/pipeline.py')
          feature = Path('.ai-sdlc/features/FEATURE-002-timed-training-mode')

          human_feedback = Path('/tmp/human-feedback.md')
          human_feedback.write_text('''# Human feedback\n\nБизнес-описание изменилось. Вместо «10 примеров за 60 секунд» требуется: «неограниченное количество примеров за 60 секунд, таймер, авто-завершение и отображение результата».\n\nRequirements revision 1 требуется пересобрать под новую бизнес-семантику.\n''', encoding='utf-8')
          subprocess.run(['python3', str(pipeline), 'decide', '--feature-dir', str(feature), '--stage', 'requirements', '--kind', 'human', '--verdict', 'changes_requested', '--feedback-file', str(human_feedback)], check=True)

          business = Path('/tmp/business-request.md')
          business.write_text('''# Business request\n\n- Feature ID: FEATURE-002\n- Title: Режим тренировки на время\n- Author: User / product stakeholder\n- Date: 2026-09-06\n\n## Business problem\n\nТекущий математический тренажер позволяет решать фиксированную сессию из 10 примеров без ограничения общего времени. Нужен дополнительный режим, который тренирует скорость решения: пользователь должен решать столько примеров, сколько успеет за фиксированные 60 секунд.\n\n## Desired outcome\n\nПользователь может запустить тренировку на время, непрерывно получать новые примеры в течение 60 секунд, видеть таймер, а по истечении времени сессия автоматически завершается и показывает итоговый результат.\n\n## Users and stakeholders\n\n- Школьник, использующий математический тренажер.\n- Родитель/учитель как заинтересованный наблюдатель результата.\n\n## Business constraints\n\n- Количество примеров в timed-сессии заранее не ограничено числом 10.\n- Лимит времени — ровно 60 секунд.\n- После каждого принятого ответа пользователь получает следующий пример, пока не истекло время.\n- Существующий обычный режим не должен быть сломан.\n\n## Existing evidence or references\n\n- Существующая реализация FEATURE-001 в репозитории math-gym.\n- Обновленное бизнес-описание пользователя: «Добавить режим тренировки на время: неограниченное количество примеров за 60 секунд, таймер, авто-завершение и отображение результата.»\n\n## Explicit non-goals\n\n- Настраиваемая длительность таймера.\n- Адаптивная сложность.\n- Пауза или продолжение сессии после перезагрузки страницы.\n- Рейтинг, история результатов или аккаунты пользователей.\n\n## Assumptions\n\n- Режим на время добавляется как дополнительный режим и не заменяет существующую тренировку без таймера.\n- Если время закончилось до отправки текущего ответа, незавершенный ответ не засчитывается.\n- В рамках одной timed-сессии допускается повторное появление задачи только если это потребуется из-за исчерпания доступного пула; для текущих пулов за 60 секунд это практически недостижимо, но точная политика повторов должна быть определена требованиями.\n\n## Open questions\n\n- Как именно отображать результат: количество правильных ответов, количество решенных, точность или комбинацию этих показателей?\n- Должны ли примеры внутри одной timed-сессии быть уникальными до исчерпания пула?\n- Подтвердить, что timed-режим сосуществует с обычным режимом.\n''', encoding='utf-8')
          subprocess.run(['python3', str(pipeline), 'sync-business-request', '--feature-dir', str(feature), '--source', str(business)], check=True)
          state = json.loads((feature/'state.json').read_text(encoding='utf-8'))
          b = state['business_request']

          req = Path('/tmp/requirements.md')
          req.write_text(f'''# Functional specification\n\n- Feature ID: FEATURE-002\n- Revision: 2\n- Input business-request revision: {b['revision']} / SHA-256: {b['sha256']}\n- Author role: Product agent\n\n## Goal\n\nДобавить отдельный режим «На время», в котором пользователь в течение фиксированных 60 секунд последовательно решает неограниченное заранее количество примеров: после каждого принятого ответа сразу показывается следующий пример. Сессия автоматически завершается по дедлайну, после чего показывается итоговый результат.\n\n## Non-goals\n\n- Ограничение timed-сессии десятью примерами.\n- Настраиваемая длительность.\n- Пауза, продление или восстановление timed-сессии после reload.\n- Изменение математических пулов FEATURE-001.\n- Backend, аккаунты, история результатов, рейтинги.\n- Изменение обычного режима кроме выбора режима до старта.\n\n## Actors and permissions\n\n- **Школьник** — выбирает класс и режим, запускает сессию, вводит ответы, видит итог.\n- **Родитель/учитель** — отдельной роли и прав нет; может только наблюдать экран результата.\n- Аутентификация отсутствует.\n\n## Glossary\n\n- **Обычный режим** — существующая FEATURE-001 сессия из 10 заданий без общего таймера.\n- **Timed-режим** — новая сессия фиксированной длительности 60 секунд без заранее заданного количества задач.\n- **Дедлайн** — момент `startedAt + 60 000 ms`.\n- **Принятый ответ** — submit, обработанный строго до дедлайна.\n- **Решено** — количество принятых ответов, независимо от правильности.\n- **Правильно** — количество принятых ответов, совпавших с правильным ответом задачи.\n\n## User scenarios\n\n### Main scenarios\n\n**SCENARIO-001 — Непрерывное решение до таймаута**\n1. Пользователь выбирает класс и режим «На время».\n2. После успешного старта показывается первый пример и начинается отсчет 60 секунд.\n3. Пользователь отправляет ответ.\n4. Если дедлайн еще не достигнут, приложение принимает ответ и немедленно показывает следующий пример.\n5. Шаги 3–4 повторяются столько раз, сколько пользователь успеет за 60 секунд.\n6. При достижении дедлайна приложение автоматически завершает сессию и показывает результат.\n\n**SCENARIO-002 — Таймаут при введенном, но не отправленном ответе**\n- Введенное значение отбрасывается; оно не увеличивает количество решенных и не влияет на количество правильных.\n\n### Alternative and negative scenarios\n\n**SCENARIO-003 — Submit на границе дедлайна**\n- Если в момент обработки submit `now >= deadline`, ответ не принимается и выполняется завершение по таймауту.\n\n**SCENARIO-004 — Browser throttling / background tab**\n- Визуальные тики могут задерживаться, но дедлайн не переносится; при следующем выполнении приложение сравнивает текущее время с абсолютным дедлайном.\n\n**SCENARIO-005 — Reload**\n- Timed-сессия сбрасывается и не восстанавливается.\n\n**SCENARIO-006 — Ошибка старта**\n- Если нельзя создать сессию, таймер не стартует и используется существующая ошибка старта FEATURE-001.\n\n## Business rules\n\n- **BR-001.** Timed-режим дополнительный; ordinary-режим сохраняется.\n- **BR-002.** Timed-сессия не имеет заранее заданного лимита по количеству примеров.\n- **BR-003.** Длительность равна ровно 60 000 ms.\n- **BR-004.** После каждого принятого ответа до дедлайна должен быть доступен следующий пример без дополнительного подтверждения.\n- **BR-005.** Timed-сессия завершается только по дедлайну или технической ошибке, но не по достижению количества решенных задач.\n- **BR-006.** После дедлайна новые ответы не принимаются.\n- **BR-007.** Частично введенный ответ на дедлайне отбрасывается.\n- **BR-008.** Внутри одной timed-сессии задачи должны быть уникальными, пока не исчерпан пул выбранного класса; после исчерпания пула допускается новый цикл выборки.\n- **BR-009.** В timed-режиме не показывается правильность после каждого ответа.\n- **BR-010.** Reload сбрасывает сессию.\n\n## Validation and errors\n\n- Старт доступен только после выбора класса и режима.\n- Сохраняются текущие правила ввода ответа FEATURE-001.\n- Submit после дедлайна отвергается независимо от визуального таймера.\n- Повторные timeout callbacks после завершения идемпотентны.\n- Если следующий пример невозможно получить из-за повреждения каталога, сессия завершается технической ошибкой и не должна показывать ложный пользовательский результат.\n\n## Functional requirements\n\n### FR-001 Выбор режима\n- Description: До старта пользователь явно выбирает ordinary или timed.\n- Priority: Must.\n\n### FR-002 Неограниченная последовательность задач\n- Description: Timed-сессия не ограничивается десятью задачами. После каждого принятого ответа до дедлайна приложение выдает следующую задачу.\n- Priority: Must.\n- Dependencies: FR-001.\n\n### FR-003 Выбор задач без повторов до исчерпания пула\n- Description: В рамках timed-сессии уже показанная задача не должна повторяться, пока доступен хотя бы один еще не показанный элемент пула выбранного класса. После полного исчерпания пула начинается новый цикл выборки.\n- Priority: Must.\n- Dependencies: FR-002, каталог FEATURE-001.\n\n### FR-004 60-секундный абсолютный дедлайн\n- Description: Дедлайн равен `startedAt + 60 000 ms` и определяется по реальному времени, а не числу timer ticks.\n- Priority: Must.\n\n### FR-005 Видимый таймер\n- Description: Во время timed-сессии постоянно отображается оставшееся время, не ниже нуля.\n- Priority: Must.\n- Dependencies: FR-004.\n\n### FR-006 Автозавершение по таймауту\n- Description: При `now >= deadline` сессия автоматически и ровно один раз завершается без пользовательского подтверждения.\n- Priority: Must.\n- Dependencies: FR-004.\n\n### FR-007 Семантика submit на дедлайне\n- Description: Ответ засчитывается только если submit обработан при `now < deadline`; иначе ответ отбрасывается и сессия завершается по timeout.\n- Priority: Must.\n- Dependencies: FR-004, FR-006.\n\n### FR-008 Итоговый результат\n- Description: После timeout приложение показывает минимум количество правильных ответов и количество решенных примеров за 60 секунд. Формат должен позволять однозначно понять оба числа.\n- Priority: Must.\n- Dependencies: FR-002, FR-006, FR-007.\n\n### FR-009 Повтор timed-сессии\n- Description: «Еще раз» запускает новую независимую timed-сессию с тем же классом и режимом; возврат к выбору позволяет изменить класс или режим.\n- Priority: Must.\n\n### FR-010 Совместимость ordinary-режима\n- Description: Ordinary-режим продолжает работать как FEATURE-001: 10 задач, без общего таймера.\n- Priority: Must.\n\n### FR-011 Accessibility\n- Description: Таймер доступен программно, но обновление каждую секунду не создает непрерывный live-announcement; событие «Время вышло» объявляется.\n- Priority: Must.\n\n### FR-012 Analytics\n- Description: Телеметрия различает ordinary/timed, completion reason и передает итоговые агрегаты timed-сессии без выражений и введенных ответов.\n- Priority: Should.\n\n## Acceptance criteria\n\n- **AC-001 / FR-002:** Given timed-сессия активна и пользователь уже решил 10 задач до 60 секунд, when он отправляет 10-й ответ до дедлайна, then сессия не завершается и показывает 11-й пример.\n- **AC-002 / FR-002:** Given timed-сессия активна, when каждый ответ принимается до дедлайна, then новый пример появляется без дополнительного действия и количество решенных может быть больше 10.\n- **AC-003 / FR-003:** Given в текущем цикле пула есть непоказанные задачи, when запрашивается следующий пример, then ранее показанная в этом цикле задача не выбирается.\n- **AC-004 / FR-004, FR-005:** Given timed-сессия стартовала в T0, when проходит 25 секунд, then UI показывает приблизительно 35 секунд остатка, вычисленных от абсолютного дедлайна.\n- **AC-005 / FR-006:** Given пользователь ничего не делает, when `now >= T0+60s`, then результат показывается автоматически без submit.\n- **AC-006 / FR-007:** Given ответ набран, when submit обрабатывается при `now >= deadline`, then он не увеличивает solved/correct.\n- **AC-007 / FR-008:** Given к timeout принято 17 ответов, 14 из них правильные, then результат однозначно показывает `14 правильных` и `17 решено` (или эквивалентный формат с обоими числами).\n- **AC-008 / FR-009:** Given timed-результат показан, when пользователь нажимает «Еще раз», then стартует новая 60-секундная сессия со счетчиками 0/0.\n- **AC-009 / FR-010:** Given ordinary-режим выбран, when решено 10 задач, then он завершается как FEATURE-001 и никакой 60-секундный timeout к нему не применяется.\n- **AC-010 / FR-011:** Timer ticks не объявляются screen reader каждую секунду; timeout announcement доступен.\n\n## Analytics / telemetry expectations\n\n- `session_started`: добавить `mode=ordinary|timed`.\n- `answer_submitted`: для timed можно передавать порядковый номер принятого ответа, но не expression/entered answer.\n- `session_completed`: добавить `mode`, `completion_reason=completed_all|timeout`, а для timed — агрегаты `solved_count`, `correct_count`, `duration_ms`.\n- Сохраняются существующие правила allowlist и analytics policy.\n\n## Non-functional expectations\n\n- Дедлайн не должен зависеть от стабильности `setInterval`.\n- Завершение сессии должно быть идемпотентным.\n- Ordinary-режим не должен получить новый timer dependency.\n- UI остается usable на текущих mobile widths.\n\n## Assumptions\n\n- **ASSUMPTION-001.** Timed-режим дополнительный.\n- **ASSUMPTION-002.** Итог должен показывать как минимум correct_count и solved_count; это наиболее прямое отображение результата для неограниченного числа задач.\n- **ASSUMPTION-003.** Задачи уникальны до исчерпания пула, затем разрешается новый цикл.\n- **ASSUMPTION-004.** Countdown начинается при активации первого timed-задания после успешного session creation.\n\n## Open questions\n\n- **Q-001.** Подтвердить формат/семантику результата: `правильно X / решено Y` (оба показателя), а не `X из 10`.\n- **Q-002.** Подтвердить правило уникальности задач до исчерпания пула и новый цикл после исчерпания.\n- **Q-003.** Подтвердить, что режим timed сосуществует с ordinary.\n- **Q-004.** Подтвердить момент старта countdown: первый timed-task активен после успешного создания сессии.\n''', encoding='utf-8')
          subprocess.run(['python3', str(pipeline), 'submit', '--feature-dir', str(feature), '--stage', 'requirements', '--source', str(req)], check=True)
          state = json.loads((feature/'state.json').read_text(encoding='utf-8'))
          cur = state['artifacts']['requirements']['current']
          review = Path('/tmp/review.md')
          review.write_text(f'''# Independent AI review\n\n- Feature ID: FEATURE-002\n- Artifact / item: requirements\n- Reviewed revision/hash: {cur['revision']} / SHA-256: {cur['sha256']}\n- Reviewer role: Requirements reviewer\n- Verdict: approved\n\n## Findings\n\nNo blocking or high findings.\n\n### FINDING-001 Result semantics require product confirmation\n- Severity: low\n- Location / stable ID: FR-008, ASSUMPTION-002, Q-001\n- Evidence: Updated business description requires «отображение результата» but does not define the exact metric now that denominator 10 no longer exists. The spec proposes showing both correct_count and solved_count.\n- Required change: No producer change before human gate. Human approval confirms the proposed result semantics; otherwise request changes.\n- Affected upstream/downstream IDs: FR-008, analytics, UX, test plan.\n\n### FINDING-002 Repetition policy is an explicit interpretation\n- Severity: low\n- Location / stable ID: FR-003, ASSUMPTION-003, Q-002\n- Evidence: «Неограниченное количество примеров» does not state whether repeats are allowed. The spec chooses no repeats until pool exhaustion, then starts a new cycle.\n- Required change: Confirm or replace this rule at human gate.\n- Affected upstream/downstream IDs: FR-002, FR-003, architecture sampling strategy, tests.\n\n## Review summary\n\n- New business request is correctly reflected: there is no fixed 10-problem cap in timed mode.\n- AC-001 explicitly protects the new semantics: the 10th accepted answer must lead to the 11th task if time remains.\n- Deadline race, background throttling, reload, start failure and idempotent timeout remain covered.\n- Ordinary FEATURE-001 behavior remains isolated.\n- Requirements expose, rather than hide, ambiguities introduced by the changed business description.\n\n## Open questions\n\n- Q-001: Approving confirms result shows both correct_count and solved_count.\n- Q-002: Approving confirms unique tasks until pool exhaustion, then a fresh cycle is allowed.\n- Q-003: Approving confirms timed is additional to ordinary mode.\n- Q-004: Approving confirms the 60-second clock begins when the first timed task becomes active after successful session creation.\n''', encoding='utf-8')
          subprocess.run(['python3', str(pipeline), 'decide', '--feature-dir', str(feature), '--stage', 'requirements', '--kind', 'ai', '--verdict', 'approved', '--feedback-file', str(review)], check=True)
          PY
      - name: Commit durable state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ai-sdlc/features/FEATURE-002-timed-training-mode
          git rm .github/workflows/feature-002-requirements-revise.yml
          git commit -m "feat(FEATURE-002): revise requirements for unlimited timed tasks"
          git push origin HEAD:feature/FEATURE-002-timed-training
