name: feature-002-revise-pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  revise:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/FEATURE-002-timed-training
      - uses: actions/checkout@v4
        with:
          repository: v-v-d/ai-workflow
          ref: main
          path: .feature-pipeline
      - name: Run revision workflow
        run: |
          bash scripts/feature-002-revise.sh
      - name: Commit durable state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ai-sdlc/features/FEATURE-002-timed-training-mode
          git rm .github/workflows/feature-002-revise-pr.yml .github/workflows/feature-002-requirements-revise.yml scripts/feature-002-revise.sh
          git commit -m "feat(FEATURE-002): revise requirements for unlimited timed tasks"
          git push origin HEAD:feature/FEATURE-002-timed-training
