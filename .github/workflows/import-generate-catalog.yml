name: import-generate-catalog

on:
  push:
    branches:
      - import/math-trainer

permissions:
  contents: write

jobs:
  generate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: import/math-trainer
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate immutable problem catalog
        run: node scripts/generate-problems.mjs
      - name: Commit generated catalog and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/generated/problems.json
          git rm .github/workflows/import-generate-catalog.yml
          git commit -m "import: add generated problem catalog"
          git push origin HEAD:import/math-trainer
