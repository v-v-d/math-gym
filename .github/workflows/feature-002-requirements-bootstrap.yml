name: feature-002-requirements-bootstrap

on: [push]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout math-gym
        uses: actions/checkout@v4
        with:
          ref: feature/FEATURE-002-timed-training
      - name: Checkout feature-pipeline
        uses: actions/checkout@v4
        with:
          repository: v-v-d/ai-workflow
          ref: main
          path: .feature-pipeline
      - name: Run governed pipeline through requirements AI review
        run: python3 .github/scripts/bootstrap_feature_002.py
      - name: Persist durable feature record
        run: |
          rm -rf .feature-pipeline
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ai-sdlc/features/FEATURE-002-timed-training-mode
          git rm .github/workflows/feature-002-requirements-bootstrap.yml
          git rm .github/scripts/bootstrap_feature_002.py
          git commit -m "feat(FEATURE-002): initialize requirements human gate"
          git push origin HEAD:feature/FEATURE-002-timed-training
