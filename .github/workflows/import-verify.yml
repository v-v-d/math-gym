name: import-verify

on:
  push:
    branches:
      - import/math-trainer

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: import/math-trainer
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Verify application
        run: npm run verify
      - name: Commit lockfile and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src/generated/problems.json
          git rm .github/workflows/import-verify.yml
          git commit -m "chore: add lockfile and verify import"
          git push origin HEAD:import/math-trainer
