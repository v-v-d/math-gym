name: feature-002-advance-design

on:
  push:
    branches:
      - feature/FEATURE-002-timed-training

permissions:
  contents: write

jobs:
  advance:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/FEATURE-002-timed-training
      - uses: actions/checkout@v4
        with:
          repository: v-v-d/ai-workflow
          ref: main
          path: .feature-pipeline
      - name: Advance pipeline to design human gate
        run: python3 scripts/feature-002-advance-design.py
      - name: Commit durable state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ai-sdlc/features/FEATURE-002-timed-training-mode
          git rm .github/workflows/feature-002-advance-design.yml scripts/feature-002-advance-design.py
          git commit -m "feat(FEATURE-002): approve requirements and open design gate"
          git push origin HEAD:feature/FEATURE-002-timed-training
