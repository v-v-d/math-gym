name: feature-002-design-r2

on:
  push:
    branches:
      - feature/FEATURE-002-timed-training

permissions:
  contents: write

jobs:
  advance:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/FEATURE-002-timed-training
      - uses: actions/checkout@v4
        with:
          repository: v-v-d/ai-workflow
          ref: main
          path: .feature-pipeline
      - name: Record design changes and submit revision 2
        run: |
          set -euo pipefail
          FEATURE=.ai-sdlc/features/FEATURE-002-timed-training-mode
          PIPELINE=.feature-pipeline/scripts/pipeline.py

          cat > /tmp/design-human-feedback.md <<'EOF'
          # Human review feedback

          - Feature ID: FEATURE-002
          - Artifact / item: design
          - Reviewed revision/hash: 1 / SHA-256: 78590e88ccd941f9bf190dd3bbc0e096af3f8e69396ea792c536703ad59ca0bb
          - Reviewer role: Human approver
          - Verdict: changes_requested

          ## Feedback

          UX/UI specification должна включать визуальные макеты ключевых экранов как часть самого design artifact, чтобы до архитектуры было понятно, как визуально выглядит решение.
          EOF

          python3 "$PIPELINE" decide \
            --feature-dir "$FEATURE" \
            --stage design \
            --kind human \
            --verdict changes_requested \
            --feedback-file /tmp/design-human-feedback.md

          python3 "$PIPELINE" submit \
            --feature-dir "$FEATURE" \
            --stage design \
            --source "$FEATURE/03-ux-spec.md"

          CURRENT_SHA=$(python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('.ai-sdlc/features/FEATURE-002-timed-training-mode/state.json').read_text())
          print(s['artifacts']['design']['current']['sha256'])
          PY
          )

          cat > /tmp/design-ai-review.md <<EOF
          # Independent AI review

          - Feature ID: FEATURE-002
          - Artifact / item: design
          - Reviewed revision/hash: 2 / SHA-256: ${CURRENT_SHA}
          - Reviewer role: Design reviewer
          - Verdict: approved

          ## Findings

          No blocking or high findings.

          ### FINDING-001 Visual mockups are now part of the design contract
          - Severity: low
          - Location / stable ID: SCREEN-001, SCREEN-002, SCREEN-003, Prototype / mockup evidence
          - Evidence: Revision 2 links and embeds repository-native mockups for the start screen, timed exercise and timed result directly in the UX/UI specification.
          - Required change: None before human gate.
          - Affected upstream/downstream IDs: FR-001, FR-002, FR-005, FR-006, FR-008, implementation tasks, E2E visual verification.

          ### FINDING-002 Mockup fidelity is sufficient for architecture handoff
          - Severity: low
          - Location / stable ID: Prototype / mockup evidence, Q-UX-001
          - Evidence: The mockups fix layout, hierarchy, controls and key copy while explicitly leaving pixel-perfect styling to the existing FEATURE-001 UI system.
          - Required change: None before human gate; human approval confirms this level of fidelity is sufficient.
          - Affected upstream/downstream IDs: architecture decomposition and implementation acceptance.

          ### FINDING-003 Optional accuracy metric remains non-primary
          - Severity: low
          - Location / stable ID: SCREEN-003, RESULT-STATS-001, Q-UX-002
          - Evidence: Mandatory result remains `Правильно X` + `Решено Y`; `Точность Z%` is explicitly optional and secondary.
          - Required change: None before human gate.
          - Affected upstream/downstream IDs: FR-008, test plan.

          ## Review summary

          - Requirement mapping covers FR-001..FR-012.
          - Design revision 2 now contains visual evidence for every key new screen.
          - Main timed flow, timeout, repeat and ordinary regression path remain represented.
          - Accessibility constraints remain intact: no per-second live announcements and no flashing countdown.
          - The artifacts are implementation-feasible in the current SPA and sufficiently concrete for architecture work.

          ## Open questions

          - Q-UX-001: Human approval confirms the three embedded SVG mockups are sufficient as the visual contract for this feature.
          - Q-UX-002: Human approval confirms accuracy percentage remains optional/non-primary.
          - Q-UX-003: Human approval confirms last-10-seconds emphasis remains bounded to non-flashing visual treatment.
          EOF

          python3 "$PIPELINE" decide \
            --feature-dir "$FEATURE" \
            --stage design \
            --kind ai \
            --verdict approved \
            --feedback-file /tmp/design-ai-review.md

          python3 "$PIPELINE" status --feature-dir "$FEATURE"
      - name: Commit durable pipeline state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ai-sdlc/features/FEATURE-002-timed-training-mode
          git rm .github/workflows/feature-002-design-r2.yml
          git commit -m "feat(FEATURE-002): submit design revision 2 with mockups"
          git push origin HEAD:feature/FEATURE-002-timed-training
