name: feature-002-architecture-r1

on:
  push:
    branches:
      - feature/FEATURE-002-timed-training

permissions:
  contents: write

jobs:
  advance:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/FEATURE-002-timed-training
      - uses: actions/checkout@v4
        with:
          repository: v-v-d/ai-workflow
          ref: main
          path: .feature-pipeline
      - name: Approve design and submit architecture
        run: |
          set -euo pipefail
          FEATURE=.ai-sdlc/features/FEATURE-002-timed-training-mode
          PIPELINE=.feature-pipeline/scripts/pipeline.py

          python3 "$PIPELINE" decide \
            --feature-dir "$FEATURE" \
            --stage design \
            --kind human \
            --verdict approved

          cp "$FEATURE/04-architecture.md" /tmp/architecture-r1.md

          python3 "$PIPELINE" submit \
            --feature-dir "$FEATURE" \
            --stage architecture \
            --source /tmp/architecture-r1.md

          CURRENT_SHA=$(python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('.ai-sdlc/features/FEATURE-002-timed-training-mode/state.json').read_text())
          print(s['artifacts']['architecture']['current']['sha256'])
          PY
          )

          cat > /tmp/architecture-ai-review.md <<EOF
          # Independent AI review

          - Feature ID: FEATURE-002
          - Artifact / item: architecture
          - Reviewed revision/hash: 1 / SHA-256: ${CURRENT_SHA}
          - Reviewer role: Architecture reviewer
          - Verdict: approved

          ## Findings

          No blocking or high findings.

          ### FINDING-001 Absolute deadline rule closes the main timing race
          - Severity: low
          - Location / stable ID: ADR-001, domain transitions, RISK-001
          - Evidence: Both timer callbacks and answer submit resolve against the same injected-clock condition `now >= deadlineAt`, so delayed browser timers cannot extend the session and equality is deterministic.
          - Required change: None before human gate.
          - Affected IDs: FR-004, FR-006, FR-007, TASK-001, TASK-003, E2E-002, E2E-004.

          ### FINDING-002 Ordinary-mode compatibility is explicitly protected
          - Severity: low
          - Location / stable ID: ADR-004, TASK-001, TASK-002, TASK-005
          - Evidence: The architecture keeps fixed 10-problem completion as an explicit ordinary branch and requires regression coverage instead of silently converting FEATURE-001 to new timed semantics.
          - Required change: None before human gate.
          - Affected IDs: FR-010, RISK-002.

          ### FINDING-003 Timed problem generation matches the approved no-repeat policy
          - Severity: low
          - Location / stable ID: ADR-003
          - Evidence: A shuffled full-grade queue is consumed by reference and refilled only after exhaustion, satisfying no-repeat-until-pool-exhaustion without inventing a timed answer limit.
          - Required change: None before human gate.
          - Affected IDs: FR-002, FR-003, TASK-002.

          ### FINDING-004 Visual implementation boundary is appropriately explicit
          - Severity: low
          - Location / stable ID: UI/view changes, RISK-005, Q-ARCH-003
          - Evidence: The approved mockups are treated as the layout/look-and-feel contract, while decorative assets may be technically adapted so long as accessibility and hierarchy are preserved.
          - Required change: Human approval should confirm Q-ARCH-003.
          - Affected IDs: SCREEN-001, SCREEN-002, SCREEN-003, TASK-005, TASK-006.

          ## Review summary

          - Architecture is grounded in the current repository: the existing domain state machine, controller, view, injected Clock/RandomSource and analytics boundary are extended rather than replaced.
          - No backend, storage or migration is introduced.
          - Failure behavior, rollback, privacy and observability are addressed.
          - Three vertical implementation stages form an acyclic dependency graph and each stage has at least one task and one E2E item.
          - Main risk areas are explicitly covered by deterministic unit/E2E contracts.

          ## Open questions

          - Q-ARCH-001: Confirm accuracy is derived presentation and need not be persisted in domain state.
          - Q-ARCH-002: Confirm implementation may choose a UI refresh interval in the 250–1000 ms range while the absolute deadline remains exact.
          - Q-ARCH-003: Confirm decorative illustration assets may be adapted technically while preserving approved visual hierarchy and tone.
          EOF

          python3 "$PIPELINE" decide \
            --feature-dir "$FEATURE" \
            --stage architecture \
            --kind ai \
            --verdict approved \
            --feedback-file /tmp/architecture-ai-review.md

          python3 "$PIPELINE" status --feature-dir "$FEATURE"
      - name: Commit durable pipeline state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ai-sdlc/features/FEATURE-002-timed-training-mode
          git rm .github/workflows/feature-002-architecture-r1.yml
          git commit -m "feat(FEATURE-002): submit architecture revision 1"
          git push origin HEAD:feature/FEATURE-002-timed-training
